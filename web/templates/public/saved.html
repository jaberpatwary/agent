<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সংরক্ষিত খবর | দ্য ডেইলি স্টার বাংলা</title>
  <meta name="robots" content="noindex">
  {{ template "portal_assets" . }}
</head>
<body class="path-taxonomy">
<div class="page-wrapper">
  {{ template "portal_header" . }}
  <main role="main" class="main" id="main-content">
    <div class="news-section section-spacer mt-5">
      <div class="row">
        <div class="column small-12">
          <div class="section-title-wrapper"><h1 class="section-title">সংরক্ষিত খবর</h1></div>
          <div class="ds-saved-tools" data-saved-tools hidden>
            <span><span data-saved-total>০</span>টি খবর এই ব্রাউজারে সংরক্ষিত</span>
            <button type="button" class="cta-small" data-clear-saved>সব মুছে ফেলুন</button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-5 lg:grid-cols-5 gap-[32px] my-10" data-saved-grid></div>
          <p class="ds-empty" data-saved-empty hidden>এখনো কোনো খবর সংরক্ষণ করেননি। যেকোনো খবরের পাতায় “সংরক্ষণ” চাপলে তা এখানে জমা থাকবে। <a href="/">খবর দেখুন</a></p>
        </div>
      </div>
    </div>
  </main>
  {{ template "portal_footer" . }}
</div>
  {{ template "portal_scripts" . }}
  <script>
    (function () {
      var grid = document.querySelector('[data-saved-grid]');
      var empty = document.querySelector('[data-saved-empty]');
      var tools = document.querySelector('[data-saved-tools]');
      var total = document.querySelector('[data-saved-total]');
      var armed = false;
      function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
      function render() {
        var list = DS.saved.all();
        total.textContent = DS.digits(list.length);
        empty.hidden = list.length > 0;
        tools.hidden = list.length === 0;
        grid.innerHTML = list.map(function (it) {
          return '<div class="card relative !mb-0"><div class="card-image-col"><div class="card-image relative overflow-hidden aspect-video' + (it.img ? '' : ' no-img') + '">' +
            '<a href="/article/' + esc(it.id) + '">' + (it.img ? '<picture><img src="' + esc(it.img) + '" alt="" loading="lazy" onerror="dsImgFail(this)"></picture>' : '') + '</a></div></div>' +
            '<div class="card-content !gap-[20px]"><h5 class="card-title "><a href="/article/' + esc(it.id) + '">' + esc(it.title) + '</a></h5>' +
            '<div class="card-info "><span class="flex items-center gap-[4px]">' + esc(it.cat) + '</span>' +
            '<button type="button" class="no-style ds-unsave" data-save data-id="' + esc(it.id) + '" data-title="' + esc(it.title) + '" data-img="' + esc(it.img) + '" data-cat="' + esc(it.cat) + '">সরান</button></div></div></div>';
        }).join('');
      }
      render();
      document.addEventListener('click', function (e) {
        if (e.target.closest('[data-save]')) setTimeout(render, 0);
        var clear = e.target.closest('[data-clear-saved]');
        if (!clear) return;
        if (!armed) { armed = true; clear.textContent = 'নিশ্চিত? আবার চাপুন'; setTimeout(function () { armed = false; clear.textContent = 'সব মুছে ফেলুন'; }, 3000); return; }
        DS.saved.write([]); armed = false; clear.textContent = 'সব মুছে ফেলুন'; render();
      });
    })();
  </script>
</body>
</html>
