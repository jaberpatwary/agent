<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সংরক্ষিত খবর | বাংলা নিউজ</title>
  <meta name="robots" content="noindex">
  {{ template "portal_assets" . }}
</head>
<body>
  {{ template "portal_header" . }}
  <main class="page">
    <div class="wrap">
      <header class="listing-hero">
        <h1>সংরক্ষিত খবর</h1>
        <p><span data-saved-total>০</span>টি খবর · শুধু এই ব্রাউজারে রাখা</p>
      </header>

      <div class="saved-tools" data-saved-tools hidden>
        <button type="button" class="pill-btn" data-clear-saved>সব মুছে ফেলুন</button>
      </div>

      <div class="listing-grid saved-grid" data-saved-grid></div>

      <div class="empty" data-saved-empty hidden>
        <div class="big">এখনও কোনো খবর সংরক্ষণ করেননি</div>
        <p>যেকোনো খবরের ছবির কোণে
          <svg class="inline-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg>
          চিহ্নে চাপুন — পরে পড়ার জন্য এখানে জমা থাকবে।</p>
        <a href="/" class="btn-primary">খবর দেখুন</a>
      </div>
    </div>
  </main>
  {{ template "portal_footer" . }}
  {{ template "portal_scripts" . }}
  <script>
    (function () {
      var grid = document.querySelector('[data-saved-grid]');
      var empty = document.querySelector('[data-saved-empty]');
      var tools = document.querySelector('[data-saved-tools]');
      var total = document.querySelector('[data-saved-total]');
      function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
      function ago(ms) {
        var m = Math.floor((Date.now() - ms) / 60000);
        if (m < 1) return 'এইমাত্র';
        if (m < 60) return BN.digits(m) + ' মিনিট আগে';
        var h = Math.floor(m / 60);
        if (h < 24) return BN.digits(h) + ' ঘণ্টা আগে';
        return BN.digits(Math.floor(h / 24)) + ' দিন আগে';
      }
      function render() {
        var list = BN.saved.all();
        total.textContent = BN.digits(list.length);
        empty.hidden = list.length > 0;
        tools.hidden = list.length === 0;
        grid.innerHTML = list.map(function (it) {
          return '<article class="card">' +
            '<div class="card-media"><a href="/article/' + esc(it.id) + '"><span class="media' + (it.img ? '' : ' is-empty') + '">' +
            (it.img ? '<img src="' + esc(it.img) + '" alt="" loading="lazy" onerror="bnImgFail(this)">' : '') +
            '<span class="media-fallback">' + esc(it.cat) + '</span></span></a>' +
            '<button type="button" class="save-btn is-saved" data-save data-id="' + esc(it.id) + '" data-title="' + esc(it.title) +
            '" data-img="' + esc(it.img) + '" data-cat="' + esc(it.cat) + '" aria-label="সংরক্ষিত তালিকা থেকে সরান" aria-pressed="true">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg></button></div>' +
            '<span class="chip">' + esc(it.cat) + '</span>' +
            '<h3 class="headline"><a href="/article/' + esc(it.id) + '">' + esc(it.title) + '</a></h3>' +
            '<span class="time">সংরক্ষণ: ' + ago(it.savedAt || Date.now()) + '</span></article>';
        }).join('');
      }
      render();
      document.addEventListener('click', function (e) {
        if (e.target.closest('[data-save]')) setTimeout(render, 0);
        if (e.target.closest('[data-clear-saved]') && confirm('সব সংরক্ষিত খবর মুছে ফেলবেন?')) {
          BN.saved.write([]); BN.syncSaved(); render();
        }
      });
    })();
  </script>
</body>
</html>
