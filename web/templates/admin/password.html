<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পাসওয়ার্ড পরিবর্তন — দ্য ডেইলি স্টার</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@700&display=swap">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="admin-body">
  <div class="admin-shell">
    {{ template "admin_sidebar" . }}
    <main class="admin-main">
      <h1>🔑 পাসওয়ার্ড পরিবর্তন</h1>
      {{ if .Error }}<div class="alert alert-error">{{ .Error }}</div>{{ end }}
      {{ if .Success }}<div class="alert alert-success">{{ .Success }}</div>{{ end }}
      <form method="post" action="/admin/password" class="admin-form card" style="padding: 24px;">
        <input type="hidden" name="_csrf" value="{{ .CSRFToken }}">
        <label>বর্তমান পাসওয়ার্ড<input type="password" name="current_password" required autocomplete="current-password"></label>
        <label>নতুন পাসওয়ার্ড (কমপক্ষে ১২ অক্ষর)<input type="password" name="new_password" required minlength="12" autocomplete="new-password"></label>
        <label>নতুন পাসওয়ার্ড আবার লিখুন<input type="password" name="confirm_password" required minlength="12" autocomplete="new-password"></label>
        <button type="submit" class="btn btn-primary" style="margin-top: 10px;">পাসওয়ার্ড আপডেট করুন</button>
      </form>
    </main>
  </div>
</body>
</html>
